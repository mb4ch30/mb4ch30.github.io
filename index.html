<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen - Licencia de Armas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando datos...</div>
    </div>

    <div class="container">
        <h1>Examen - Licencia de Armas</h1>
        
        <div id="status-bar" class="status-bar"></div>
        
        <div id="main-menu">
            <h2>Selecciona el tipo de examen</h2>
            <div class="menu-buttons main-menu-buttons">
                <button id="start-random-exam" class="menu-button">Examen Aleatorio</button>
                <button id="start-full-exam" class="menu-button">Examen Completo</button>
                <button id="start-theme-exam" class="menu-button">Examen por Temas</button>
            </div>
        </div>
        
        <div id="exam-screen" class="hidden">
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            
            <div id="question-info"></div>
            <div id="question-container" class="question">
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options-container"></div>
            </div>
            
            <div class="controls">
                <button id="prev-question" disabled>Anterior</button>
                <button id="next-question">Siguiente</button>
            </div>
        </div>

        <!-- Test por temas -->
        <div id="theme-selection-screen" class="hidden">
            <h2>Selecciona un tema</h2>
            <div id="theme-buttons" class="menu-buttons theme-buttons">
                <!-- Aquí se generarán los botones de temas dinámicamente -->
            </div>
            <div class="controls theme-controls">
                <button id="back-to-menu-from-themes">Volver al Menú</button>
            </div>
        </div>

        <div id="exam-number-screen" class="hidden">
            <h2>Selecciona un examen</h2>
            <div id="exam-number-info" class="status-bar"></div>
            <div id="exam-number-buttons" class="menu-buttons exam-buttons">
                <!-- Aquí se generarán los botones de exámenes dinámicamente -->
            </div>
            <div class="controls theme-controls">
                <button id="back-to-themes">Volver a Temas</button>
            </div>
        </div>
        
        <div id="results-screen" class="hidden">
            <h2>Resultados del Examen</h2>
            <div class="controls controls-results">
                <button id="back-from-results">Volver</button>
            </div>
            <div id="result-message" class="result"></div>
            
            <div id="question-review"></div>
            
            <div class="controls controls-results">
                <button id="back-from-results-bottom">Volver</button>
                <button id="restart-exam">Repetir Examen</button>
                <button id="new-exam">Nuevo Examen</button>
            </div>
        </div>
    </div>
    
    <script>
        // Configuración de temas y cantidad de preguntas
        const temasConfig = [
            { nombre: "TEMA I", cantidad: 4, preguntas: "Teoria/tema1_es.txt", respuestas: "respuestasFinals/tema1r_es.txt" },
            { nombre: "TEMA II", cantidad: 3, preguntas: "Teoria/tema2_es.txt", respuestas: "respuestasFinals/tema2r_es.txt" },
            { nombre: "TEMA III", cantidad: 3, preguntas: "Teoria/tema3_es.txt", respuestas: "respuestasFinals/tema3r_es.txt" },
            { nombre: "TEMA IV", cantidad: 4, preguntas: "Teoria/tema4_es.txt", respuestas: "respuestasFinals/tema4r_es.txt" },
            { nombre: "TEMA V", cantidad: 3, preguntas: "Teoria/tema5_es.txt", respuestas: "respuestasFinals/tema5r_es.txt" },
            { nombre: "TEMA VI", cantidad: 3, preguntas: "Teoria/tema6_es.txt", respuestas: "respuestasFinals/tema6r_es.txt" },
            { nombre: "TEMA VII", cantidad: 4, preguntas: "Teoria/tema7_es.txt", respuestas: "respuestasFinals/tema7r_es.txt" }
        ];
        
        // Variables globales
        let datosPreguntas = {};
        let preguntas = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let modoExamen = ""; // "random" o "full"
        let selectedTheme = "";
        let examsByTheme = {};
        const PREGUNTAS_POR_EXAMEN = 20;
        let totalPreguntas = 0;
        
        // Elementos DOM
        const loadingOverlay = document.getElementById('loading-overlay');
        const statusBar = document.getElementById('status-bar');
        const mainMenu = document.getElementById('main-menu');
        const examScreen = document.getElementById('exam-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startRandomExamButton = document.getElementById('start-random-exam');
        const startFullExamButton = document.getElementById('start-full-exam');
        const prevQuestionButton = document.getElementById('prev-question');
        const nextQuestionButton = document.getElementById('next-question');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionInfo = document.getElementById('question-info');
        const progressBar = document.getElementById('progress-bar');
        const resultMessage = document.getElementById('result-message');
        const questionReview = document.getElementById('question-review');
        const restartExamButton = document.getElementById('restart-exam');
        const newExamButton = document.getElementById('new-exam');
        
        // Inicializar la aplicación
        async function init() {
            setupEventListeners();
            await cargarDatos();
            loadingOverlay.style.display = 'none';
        }

        // Configurar event listeners
        function setupEventListeners() {
            startRandomExamButton.addEventListener('click', () => startExam('random'));
            startFullExamButton.addEventListener('click', () => startExam('full'));
            prevQuestionButton.addEventListener('click', () => navigateQuestions(-1));
            nextQuestionButton.addEventListener('click', () => navigateQuestions(1));
            restartExamButton.addEventListener('click', restartExam);
            newExamButton.addEventListener('click', newExam);
            
            // Añadir listeners para los botones de volver
            document.getElementById('back-from-results').addEventListener('click', goBackFromResults);
            document.getElementById('back-from-results-bottom').addEventListener('click', goBackFromResults);
            
            // Examen por temas
            const menuButtons = document.querySelector('.menu-buttons');
            menuButtons.innerHTML = `
                <button id="start-random-exam">Examen Aleatorio</button>
                <button id="start-full-exam">Examen Completo</button>
                <button id="start-theme-exam">Examen por Temas</button>
            `;

            document.getElementById('start-random-exam').addEventListener('click', () => startExam('random'));
            document.getElementById('start-full-exam').addEventListener('click', () => startExam('full'));
            document.getElementById('start-theme-exam').addEventListener('click', showThemeSelection);
            document.getElementById('back-to-menu-from-themes').addEventListener('click', showMainMenu);
            document.getElementById('back-to-themes').addEventListener('click', showThemeSelection);
        }

        // Función para volver desde los resultados según el modo de examen
        function goBackFromResults() {
            resultsScreen.classList.add('hidden');
            
            if (modoExamen === 'theme') {
                // Si estamos en examen por tema, volver a la pantalla de selección de exámenes
                document.getElementById('exam-number-screen').classList.remove('hidden');
            } else {
                // Si estamos en examen aleatorio o completo, volver al menú principal
                mainMenu.classList.remove('hidden');
            }
        }
                
        // Cargar datos de preguntas y respuestas
        async function cargarDatos() {
        statusBar.textContent = "Cargando datos...";
        
        let temasExitosos = 0;
        let temasTotal = temasConfig.length;
        totalPreguntas = 0; // Reiniciar el contador de preguntas
        
        for (const tema of temasConfig) {
            try {
                // Cargar archivo de preguntas
                const respuestaPreguntas = await fetch(tema.preguntas);
                
                if (!respuestaPreguntas.ok) {
                    throw new Error(`Error al cargar ${tema.preguntas}: ${respuestaPreguntas.status}`);
                }
                
                const contenidoPreguntas = await respuestaPreguntas.text();
                const preguntas = parsePreguntasFile(contenidoPreguntas);
                
                // Actualizar contador de preguntas
                totalPreguntas += preguntas.length;
                
                // Cargar archivo de respuestas
                const respuestaRespuestas = await fetch(tema.respuestas);
                
                if (!respuestaRespuestas.ok) {
                    throw new Error(`Error al cargar ${tema.respuestas}: ${respuestaRespuestas.status}`);
                }
                
                const contenidoRespuestas = await respuestaRespuestas.text();
                const respuestas = parseRespuestasFile(contenidoRespuestas);
                
                // Guardar datos
                if (!datosPreguntas[tema.nombre]) {
                    datosPreguntas[tema.nombre] = {};
                }
                
                datosPreguntas[tema.nombre].preguntas = preguntas;
                datosPreguntas[tema.nombre].respuestas = respuestas;
                
                temasExitosos++;
                statusBar.textContent = `Cargando datos: ${temasExitosos}/${temasTotal} temas cargados`;
                
            } catch (error) {
                console.error(`Error al cargar datos del ${tema.nombre}:`, error);
                statusBar.textContent += `\nError al cargar ${tema.nombre}: ${error.message}`;
            }
        }
        
        if (temasExitosos === 0) {
            statusBar.textContent = "No se pudieron cargar los datos. Asegúrate de estar usando un servidor web local.";
            // Desactivar botones si no hay datos
            startRandomExamButton.disabled = true;
            startFullExamButton.disabled = true;
        } else if (temasExitosos < temasTotal) {
            statusBar.textContent = `Se cargaron ${temasExitosos} de ${temasTotal} temas. Algunos datos pueden estar incompletos. Total: ${totalPreguntas} preguntas disponibles.`;
        } else {
            statusBar.textContent = `${temasExitosos} temas cargados con un total de ${totalPreguntas} preguntas disponibles.`;
        }
        
        return temasExitosos > 0;
    }
        
        // Parsear archivo de preguntas
        function parsePreguntasFile(text) {
            const preguntasRaw = text.split(/\n\s*\n/).filter(p => p.trim());
            const preguntas = [];
            
            for (const pregunta of preguntasRaw) {
                if (/^\d+\./.test(pregunta.trim())) {
                    preguntas.push(pregunta.trim());
                }
            }
            
            return preguntas;
        }
        
        // Parsear archivo de respuestas
        function parseRespuestasFile(text) {
            return text.split('\n')
                .filter(line => line.trim())
                .map(line => line.trim());
        }
        
        // Iniciar el examen
        function startExam(modo) {
            modoExamen = modo;
            generateExam(modo);
            showQuestion(0);
            
            // Cambiar a la pantalla de examen
            mainMenu.classList.add('hidden');
            examScreen.classList.remove('hidden');
        }
        
        // Generar examen
        function generateExam(modo) {
            preguntas = [];
            userAnswers = [];
            
            if (modo === 'random') {
                // Modo aleatorio: seleccionar preguntas según las cantidades configuradas
                for (const tema of temasConfig) {
                    const nombreTema = tema.nombre;
                    const cantidad = tema.cantidad;
                    
                    if (datosPreguntas[nombreTema] && datosPreguntas[nombreTema].preguntas.length > 0) {
                        const preguntasTema = datosPreguntas[nombreTema].preguntas;
                        const respuestasTema = datosPreguntas[nombreTema].respuestas;
                        
                        const seleccionadas = seleccionarPreguntasAleatorias(
                            preguntasTema, 
                            respuestasTema, 
                            cantidad
                        );
                        
                        for (const [pregunta, respuesta] of seleccionadas) {
                            preguntas.push({
                                texto: pregunta,
                                respuestaCorrecta: respuesta,
                                tema: nombreTema
                            });
                            userAnswers.push(null);
                        }
                    }
                }
                
                // Mezclar las preguntas
                shuffleArray(preguntas);
            } else {
                // Modo examen completo: incluir todas las preguntas
                for (const nombreTema in datosPreguntas) {
                    const preguntasTema = datosPreguntas[nombreTema].preguntas;
                    const respuestasTema = datosPreguntas[nombreTema].respuestas;
                    
                    for (let i = 0; i < preguntasTema.length; i++) {
                        preguntas.push({
                            texto: preguntasTema[i],
                            respuestaCorrecta: respuestasTema[i],
                            tema: nombreTema
                        });
                        userAnswers.push(null);
                    }
                }
                
                // Mostrar en orden por tema
                preguntas.sort((a, b) => {
                    // Primero ordenar por tema
                    const temaIndexA = Object.keys(datosPreguntas).indexOf(a.tema);
                    const temaIndexB = Object.keys(datosPreguntas).indexOf(b.tema);
                    
                    if (temaIndexA !== temaIndexB) return temaIndexA - temaIndexB;
                    
                    // Luego por número de pregunta
                    const numA = parseInt(a.texto.match(/^(\d+)\./)[1]);
                    const numB = parseInt(b.texto.match(/^(\d+)\./)[1]);
                    return numA - numB;
                });
            }
        }

        // Función para mostrar la pantalla de selección de temas
        function showThemeSelection() {
            mainMenu.classList.add('hidden');
            document.getElementById('theme-selection-screen').classList.remove('hidden');
            examScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            document.getElementById('exam-number-screen').classList.add('hidden');
            
            // Generar botones para cada tema
            const themeButtons = document.getElementById('theme-buttons');
            themeButtons.innerHTML = '';
            
            temasConfig.forEach(tema => {
                const button = document.createElement('button');
                button.textContent = `${tema.nombre} (${datosPreguntas[tema.nombre]?.preguntas?.length || 0} preguntas)`;
                button.className = 'theme-button';
                button.addEventListener('click', () => selectTheme(tema.nombre));
                themeButtons.appendChild(button);
            });
        }

        // Función para seleccionar un tema y mostrar los exámenes disponibles
        function selectTheme(temaNombre) {
            selectedTheme = temaNombre;
            document.getElementById('theme-selection-screen').classList.add('hidden');
            document.getElementById('exam-number-screen').classList.remove('hidden');
            
            // Encontrar el tema seleccionado
            const tema = temasConfig.find(t => t.nombre === temaNombre);
            const preguntas = datosPreguntas[temaNombre]?.preguntas || [];
            const respuestas = datosPreguntas[temaNombre]?.respuestas || [];
            
            // Calcular cuántos exámenes completos de 20 preguntas hay
            const numExamenes = Math.ceil(preguntas.length / PREGUNTAS_POR_EXAMEN);
            
            // Generar información sobre este tema
            const examInfo = document.getElementById('exam-number-info');
            examInfo.textContent = `${temaNombre}: ${preguntas.length} preguntas disponibles - ${numExamenes} exámenes de ${PREGUNTAS_POR_EXAMEN} preguntas`;
            
            // Generar botones para cada examen
            const examButtons = document.getElementById('exam-number-buttons');
            examButtons.innerHTML = '';
            
            // Crear un diccionario para almacenar los exámenes por tema
            examsByTheme[temaNombre] = [];
            
            for (let i = 0; i < numExamenes; i++) {
                const startIdx = i * PREGUNTAS_POR_EXAMEN;
                const endIdx = Math.min((i + 1) * PREGUNTAS_POR_EXAMEN, preguntas.length);
                
                // Guardar las preguntas de este examen
                examsByTheme[temaNombre][i] = preguntas.slice(startIdx, endIdx).map((p, idx) => ({
                    ...p,
                    respuestaCorrecta: respuestas[startIdx + idx]
                }));
                
                const button = document.createElement('button');
                button.textContent = `Examen ${i + 1} (${endIdx - startIdx} preguntas)`;
                button.className = 'exam-button';
                button.addEventListener('click', () => startThemeExam(temaNombre, i));
                examButtons.appendChild(button);
            }
        }
        // Función para iniciar un examen por tema
        function startThemeExam(temaNombre, examenIndex) {
            modoExamen = "theme";
            preguntas = examsByTheme[temaNombre][examenIndex];
            userAnswers = new Array(preguntas.length).fill(null);
            
            document.getElementById('exam-number-screen').classList.add('hidden');
            examScreen.classList.remove('hidden');
            
            // Mostrar la primera pregunta
            showQuestion(0);
        }

        // Función para volver al menú principal
        function showMainMenu() {
            mainMenu.classList.remove('hidden');
            document.getElementById('theme-selection-screen').classList.add('hidden');
            document.getElementById('exam-number-screen').classList.add('hidden');
            examScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
        }
                
        // Seleccionar preguntas aleatorias
        function seleccionarPreguntasAleatorias(preguntas, respuestas, cantidad) {
            if (preguntas.length < cantidad) {
                cantidad = preguntas.length;
            }
            
            // Crear pares de índice y pregunta
            const paresPreguntas = preguntas.map((p, i) => [i, p]);
            
            // Seleccionar aleatoriamente
            const seleccionados = getRandomSample(paresPreguntas, cantidad);
            
            // Ordenar por índice original
            seleccionados.sort((a, b) => a[0] - b[0]);
            
            // Devolver las preguntas y respuestas correspondientes
            return seleccionados.map(([idx, pregunta]) => [pregunta, respuestas[idx]]);
        }
        
        // Seleccionar elementos aleatorios de un array
        function getRandomSample(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }
        
        // Mezclar array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // Mostrar pregunta actual
        function showQuestion(index) {
            if (index < 0 || index >= preguntas.length) return;
            
            const pregunta = preguntas[index];
            const preguntaFormateada = formatPregunta(pregunta.texto);
            
            // Actualizar información de la pregunta
            questionInfo.innerHTML = `
                <span>Pregunta ${index + 1} de ${preguntas.length}</span>
                <span>${pregunta.tema}</span>
            `;
            
            // Actualizar texto de la pregunta
            questionText.innerHTML = preguntaFormateada.text;
            
            // Crear opciones
            optionsContainer.innerHTML = '';
            ['A', 'B', 'C'].forEach(letra => {
                const opcion = document.createElement('div');
                opcion.className = 'option';
                if (userAnswers[index] === letra) {
                    opcion.classList.add('selected');
                }
                // Cambiar aquí para usar negrita en las letras
                opcion.innerHTML = `<strong>${letra})</strong> ${preguntaFormateada.options[letra]}`;
                opcion.addEventListener('click', () => selectOption(letra));
                optionsContainer.appendChild(opcion);
            });
            
            // Actualizar botones de navegación
            prevQuestionButton.disabled = index === 0;
            const isLastQuestion = index === preguntas.length - 1;
            nextQuestionButton.textContent = isLastQuestion ? 'Finalizar Examen' : 'Siguiente';
            
            // Actualizar barra de progreso
            const progress = ((index + 1) / preguntas.length) * 100;
            progressBar.style.width = `${progress}%`;
            
            // Actualizar índice actual
            currentQuestionIndex = index;
        }
        
        // Formatear pregunta para extraer texto y opciones
        // Formatear pregunta para extraer texto y opciones
        function formatPregunta(textoCompleto) {
            // Eliminar el número de la pregunta
            const match = textoCompleto.match(/^\d+\.\s*(.*)/s);
            const preguntaSinNumero = match ? match[1] : textoCompleto;
            
            // Buscar las opciones A, B, C
            const opciones = {'A': '', 'B': '', 'C': ''};
            const lineas = preguntaSinNumero.split('\n');
            let textoPreg = '';
            
            // Encontrar donde empiezan las opciones (más flexible)
            let lineaOpcionesInicio = -1;
            for (let i = 0; i < lineas.length; i++) {
                if (lineas[i].match(/^[A][\)\.-]/)) {
                    lineaOpcionesInicio = i;
                    break;
                }
            }
            
            // Si no se encuentran opciones, mostrar todo como texto de pregunta
            if (lineaOpcionesInicio === -1) {
                return {
                    text: preguntaSinNumero,
                    options: opciones
                };
            }
            
            // El texto de la pregunta son todas las líneas antes de las opciones
            textoPreg = lineas.slice(0, lineaOpcionesInicio).join('<br>');
            
            // Extraer opciones con un patrón más flexible
            for (let i = lineaOpcionesInicio; i < lineas.length; i++) {
                const opcionMatch = lineas[i].match(/^([A-C])[\)\.-](.*)/);
                if (opcionMatch) {
                    const letra = opcionMatch[1];
                    let textoOpcion = opcionMatch[2].trim();
                    
                    // Eliminar caracteres ".-" al inicio del texto de la opción
                    textoOpcion = textoOpcion.replace(/^[\.\-\s]+/, '');
                    
                    opciones[letra] = textoOpcion;
                }
            }
            
            return {
                text: textoPreg,
                options: opciones
            };
        }
        
        // Seleccionar una opción
        function selectOption(letra) {
            userAnswers[currentQuestionIndex] = letra;
            
            // Actualizar UI
            const options = optionsContainer.querySelectorAll('.option');
            options.forEach(option => {
                option.classList.remove('selected');
                if (option.textContent.startsWith(letra + ')')) {
                    option.classList.add('selected');
                }
            });
        }
        
        // Navegar entre preguntas
        function navigateQuestions(direction) {
            const newIndex = currentQuestionIndex + direction;
            
            // Si estamos en la última pregunta y queremos avanzar (finalizar)
            if (currentQuestionIndex === preguntas.length - 1 && direction === 1) {
                // Comprobar si todas las preguntas tienen respuesta
                const preguntasSinResponder = userAnswers.filter(r => r === null).length;
                
                if (preguntasSinResponder > 0) {
                    if (!confirm(`Hay ${preguntasSinResponder} pregunta(s) sin responder. ¿Deseas finalizar el examen de todas formas?`)) {
                        return;
                    }
                }
                
                // Llamar a finalizar examen
                finalizarExamen();
                return;
            }
            
            // Para navegación normal entre preguntas
            if (newIndex < 0 || newIndex >= preguntas.length) return;
            
            // Mostrar la siguiente/anterior pregunta
            showQuestion(newIndex);
        }
        
        // Finalizar el examen
        function finalizarExamen() {
            console.log("Finalizando examen..."); // Para depurar
            
            // Ocultar pantalla del examen y mostrar resultados
            examScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            
            // Calcular resultados
            const totalPreguntas = preguntas.length;
            let aciertos = 0;
            
            for (let i = 0; i < preguntas.length; i++) {
                if (userAnswers[i] === preguntas[i].respuestaCorrecta) {
                    aciertos++;
                }
            }
            
            const porcentaje = (aciertos / totalPreguntas) * 100;
            const aprobado = porcentaje >= 80; // Cambiado a 80% como solicitado
            
            console.log(`Aciertos: ${aciertos}/${totalPreguntas} (${porcentaje.toFixed(1)}%)`); // Para depurar
            
            // Mostrar mensaje de resultado
            resultMessage.className = 'result ' + (aprobado ? 'pass' : 'fail');
            resultMessage.innerHTML = `
                <h3>${aprobado ? '¡APROBADO! 🎉' : 'SUSPENDIDO'}</h3>
                <p>Has acertado ${aciertos} de ${totalPreguntas} preguntas (${porcentaje.toFixed(1)}%).</p>
                <p>${aprobado ? '¡Felicidades!' : 'Se requiere al menos un 80% de aciertos para aprobar.'}</p>
            `;
            
            // Mostrar revisión de preguntas
            questionReview.innerHTML = '<h3>Revisión de Preguntas</h3>';
            
            for (let i = 0; i < preguntas.length; i++) {
                const pregunta = preguntas[i];
                const respuestaUsuario = userAnswers[i];
                const esCorrecta = respuestaUsuario === pregunta.respuestaCorrecta;
                
                const preguntaDiv = document.createElement('div');
                preguntaDiv.className = `question-review ${esCorrecta ? 'correct' : 'incorrect'}`;
                
                const preguntaFormateada = formatPregunta(pregunta.texto);
                
                // Generar HTML para mostrar las opciones
                let opcionesHTML = '<div class="options-review">';
                ['A', 'B', 'C'].forEach(letra => {
                    const esRespuestaUsuario = respuestaUsuario === letra;
                    const esRespuestaCorrecta = pregunta.respuestaCorrecta === letra;
                    
                    opcionesHTML += `
                        <p class="${esRespuestaCorrecta ? 'correct-option' : ''} ${esRespuestaUsuario && !esRespuestaCorrecta ? 'incorrect-option' : ''}">
                            <strong>${letra})</strong> ${preguntaFormateada.options[letra]}
                            ${esRespuestaCorrecta ? ' ✓' : ''}
                            ${esRespuestaUsuario && !esRespuestaCorrecta ? ' ✗' : ''}
                        </p>
                    `;
                });
                opcionesHTML += '</div>';
                
                preguntaDiv.innerHTML = `
                    <p><strong>${i + 1}. ${preguntaFormateada.text}</strong></p>
                    ${opcionesHTML}
                    <p>
                        Tu respuesta: ${respuestaUsuario ? respuestaUsuario : 'No respondida'} 
                        ${esCorrecta ? '✓' : '✗'}
                    </p>
                    <p>Respuesta correcta: ${pregunta.respuestaCorrecta}</p>
                `;
                
                questionReview.appendChild(preguntaDiv);
            }
        }
        
        // Reiniciar el mismo examen
        function restartExam() {
            // Reiniciar respuestas del usuario
            userAnswers = userAnswers.map(() => null);
            
            // Volver a la pantalla de examen
            resultsScreen.classList.add('hidden');
            examScreen.classList.remove('hidden');
            
            // Mostrar la primera pregunta
            showQuestion(0);
        }
        
        // Generar un nuevo examen
        function newExam() {
            // Volver al menú principal
            resultsScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
        }
        
        // Iniciar la aplicación
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
